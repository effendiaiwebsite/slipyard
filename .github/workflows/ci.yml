name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accountant_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm_app:crm_app_dev_password@localhost:5432/accountant_crm
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/accountant_crm
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      FIELD_ENCRYPTION_KEY: 5Ju9RJPhsJarBSrUkaEFyKbAf9Y2bK1jZLo9BvNMirI=
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (pinned 9.15.9) —
      # do NOT also pass `version:` here; action-setup errors when both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
